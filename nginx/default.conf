server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Relative redirects only: /pl -> /pl/ must not jump to port 80 (the live site).
  absolute_redirect off;

  # The preview must never show up in search results.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  location / {
    try_files $uri $uri/ =404;
  }

  # Hashed build files never change: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.(jpg|jpeg|png|ico|svg)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
